<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu | Jilbert Burgers</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-categoria="">

<header class="cabecera">
  <a class="logo" href="index.html" aria-label="Jilbert Burgers">
    <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
      <rect x="6" y="10" width="36" height="8" rx="4" fill="#FFC107"/>
      <rect x="6" y="20" width="36" height="8" rx="3" fill="#D32F2F"/>
      <rect x="6" y="30" width="36" height="8" rx="4" fill="#FFC107"/>
    </svg>
    <span>Jilbert Burgers</span>
  </a>
  <nav class="nav">
    <a href="index.html">Men&uacute;</a>
  </nav>
</header>

<section class="logo-banda">
  <img data-negocio="logo" alt="Jilbert Burgers" class="logo-banda-img">
</section>

<main class="contenedor">
  <a class="volver" href="index.html">&larr; Volver al men&uacute;</a>
  <h2 class="seccion-titulo" id="cat-titulo">Cargando&hellip;</h2>
  <p class="seccion-sub">Elige y agrega al carrito.</p>
  <section class="productos" id="lista-productos">
    <!-- Los productos se cargan desde assets/menu.json -->
  </section>
</main>

<button class="carrito-btn" id="carrito-btn" aria-label="Ver carrito">
  <span class="icono">&#128722;</span>
  <span>Mi pedido</span>
  <span class="badge" id="carrito-badge" style="display:none;">0</span>
</button>

<aside class="carrito-panel" id="carrito-panel" aria-label="Carrito de compras">
  <header>
    <h2>Tu Pedido</h2>
    <button id="carrito-cerrar" aria-label="Cerrar">&times;</button>
  </header>
  <div class="carrito-lista" id="carrito-lista"></div>
  <div class="carrito-pie">
    <div class="total"><span>Total</span><span id="carrito-total">&euro;0.00</span></div>
    <button class="btn-wa" id="carrito-enviar">Finalizar pedido</button>
    <button class="btn-vaciar" id="carrito-vaciar">Vaciar carrito</button>
  </div>
  <div class="carrito-pago-panel" id="carrito-pago-panel" aria-hidden="true">
    <header class="carrito-pago-head">
      <h3>Pago del pedido</h3>
      <button id="carrito-pago-cerrar" aria-label="Volver al carrito">&times;</button>
    </header>

    <div class="pago-total">
      <span>Total a pagar</span>
      <strong id="pago-total-valor"></strong>
      <span class="carrito-total-bs" id="pago-total-bs"></span>
    </div>

    <div class="pago-caminos" role="group" aria-label="Forma de pago">
      <button class="pago-camino activo" id="pago-camino-contado" data-camino="contado">Contado <span id="pago-off-label"></span></button>
      <button class="pago-camino" id="pago-camino-credito" data-camino="credito">Cr&eacute;dito (precio normal)</button>
    </div>

    <div class="pago-datos" id="pago-datos"></div>

    <div class="pago-instrucciones" id="pago-instrucciones"></div>

    <button class="btn-wa" id="pago-confirmar">Continuar</button>
  </div>
</aside>

<footer class="pie">
  <p><strong>Jilbert Burgers</strong></p>
  <p data-negocio="direccion">Barrio San Luis, calle Juan Borges N 11-B, Maracay, Aragua.</p>
  <p>
    <a href="https://wa.me/584124409025" target="_blank" rel="noopener" data-negocio="whatsapp">WhatsApp: 0412-440-9025</a>
    &nbsp;|&nbsp;
    <a href="https://facebook.com/jilbertburgers" target="_blank" rel="noopener" data-negocio="facebook">Facebook</a>
    &nbsp;|&nbsp;
    <a href="mailto:jilbertburgers@gmail.com" data-negocio="correo">jilbertburgers@gmail.com</a>
  </p>
</footer>

<script src="assets/script.js"></script>
</body>
</html>
